<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4b55df"><title>MediRecord | Tu salud, siempre en orden</title>
<style>
:root{--b:#3479ef;--p:#6548df;--n:#14245f;--m:#66719e;--l:#e2e7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf2ff,#f8f7ff);font-family:system-ui,Segoe UI,sans-serif;color:var(--n)}button,input{font:inherit}button{cursor:pointer}.app{max-width:1050px;margin:auto;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#46a4ff,#5a3ddd);display:grid;place-items:center;color:white;font-size:27px}.brand h1{margin:0;font-size:28px}.brand h1 span{color:var(--p)}.tag{margin:0;color:#53618f;font-size:13px}.demo,.pill{font-size:11px;font-weight:800;border-radius:25px;padding:7px 10px;background:#e8eaff;color:#4b4dcc}.layout{display:grid;grid-template-columns:205px 1fr;gap:16px}aside,.panel{background:#ffffffdf;border:1px solid var(--l);border-radius:22px;box-shadow:0 12px 35px #344b9510}aside{padding:12px;height:max-content;position:sticky;top:12px}.nav{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:13px;border-radius:13px;color:#596796;font-weight:650;text-align:left;margin:3px 0}.nav.active,.nav:hover{background:linear-gradient(100deg,#e7efff,#eeebff);color:#354ed5}.ico{font-size:20px}.panel{padding:clamp(17px,3vw,28px);min-height:640px}h2{font-size:28px;margin:0 0 5px}.sub{color:var(--m);font-size:14px;margin:0 0 20px}.welcome{border-radius:18px;padding:20px;color:white;background:linear-gradient(110deg,#3787f3,#6548df);display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.welcome h3{margin:0 0 5px}.welcome p{margin:0;font-size:13px}.big{font-size:40px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat,.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:14px}.stat{background:#f5f6ff}.stat b{display:block;font-size:24px;color:#3f50d2}.stat span{font-size:12px;color:var(--m)}.sect{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.sect h3{font-size:17px;margin:0}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;background:linear-gradient(100deg,var(--b),var(--p));color:white}.btn.alt{background:#edf0ff;color:#394fc6}.btn.sm{font-size:12px;padding:8px 10px}.med{display:flex;align-items:center;gap:11px;padding:13px;border:1px solid var(--l);border-radius:15px;background:white;margin:9px 0}.medicon{width:42px;height:42px;border-radius:13px;background:#edf0ff;display:grid;place-items:center;font-size:22px}.mi{flex:1;min-width:0}.mi strong{display:block;font-size:14px}.mi small{display:block;color:var(--m);font-size:12px;margin-top:3px}.pill.red{background:#ffebef;color:#c53550}.pill.green{background:#e6f7f1;color:#138265}.pill.amber{background:#fff2d9;color:#a96a08}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input{width:100%;border:1px solid #dce3ff;border-radius:10px;padding:10px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:14px}.notice{padding:13px;border-radius:13px;background:#f0f3ff;color:#4d5b95;font-size:12px;line-height:1.5;margin-top:15px}.alert{border-radius:14px;padding:14px;margin:10px 0;background:white;border:1px solid var(--l);display:flex;gap:12px}.alert.red{border-left:4px solid #e44e68}.alert.amber{border-left:4px solid #d88b18}.alert strong{font-size:14px}.alert p{font-size:12px;color:var(--m);margin:4px 0 0}.history{padding:13px;border-bottom:1px solid var(--l);font-size:13px}.history small{display:block;color:var(--m);margin-top:4px}.empty{text-align:center;padding:25px;color:var(--m);background:#f7f8ff;border:1px dashed #ccd5ff;border-radius:15px}footer{text-align:center;color:#7882a7;font-size:11px;padding:18px}@media(max-width:680px){.app{padding:11px}.layout{display:block}aside{position:static;display:flex;overflow:auto;padding:6px;margin-bottom:12px}.nav{width:auto;white-space:nowrap;padding:10px}.nav .label{display:none}.panel{min-height:580px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:21px}.brand h1{font-size:23px}.demo{font-size:9px}}
</style></head><body><div class="app">
<header class="head"><div class="brand"><div class="logo">💊</div><div><h1>Medi<span>Record</span></h1><p class="tag">Tu salud, siempre en orden</p></div></div><span class="demo">PROTOTIPO INTERACTIVO</span></header>
<div class="layout"><aside>
<button class="nav active" data-page="home"><span class="ico">⌂</span><span class="label">Inicio</span></button>
<button class="nav" data-page="meds"><span class="ico">💊</span><span class="label">Medicamentos</span></button>
<button class="nav" data-page="alerts"><span class="ico">🔔</span><span class="label">Alertas</span></button>
<button class="nav" data-page="history"><span class="ico">▤</span><span class="label">Historial</span></button>
<button class="nav" data-page="profile"><span class="ico">◉</span><span class="label">Mi perfil</span></button></aside>
<main><section class="panel" id="view"></section></main></div>
<footer>Proyecto académico · MediRecord · Datos de demostración, no corresponden a pacientes reales.</footer></div>
<script>
(()=>{
const $=s=>document.querySelector(s),view=$('#view');let page='home',id=4;
let meds=[{id:1,name:'Amoxicilina 500 mg',dose:'1 tableta',time:'8:00 a. m.',stock:2,expiry:'2026-11-15',taken:false},{id:2,name:'Vitamina D',dose:'1 cápsula',time:'12:00 p. m.',stock:18,expiry:'2026-12-30',taken:true},{id:3,name:'Losartán 50 mg',dose:'1 tableta',time:'8:00 p. m.',stock:25,expiry:'2027-01-20',taken:false}],history=[{name:'Vitamina D',date:'Hoy · 12:00 p. m.'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}):'Sin fecha';
const left=d=>Math.ceil((new Date(d+'T23:59:00')-new Date())/86400000);
const head=(t,s)=>`<h2>${t}</h2><p class="sub">${s}</p>`;
function card(m,home=false){return `<article class="med"><div class="medicon">💊</div><div class="mi"><strong>${esc(m.name)}</strong><small>${esc(m.dose)} · ${esc(m.time)}</small><small>${m.stock} unidades · Vence: ${fmt(m.expiry)}</small></div>${home?`<button class="btn sm" data-take="${m.id}">${m.taken?'✓ Tomada':'Marcar toma'}</button>`:`<span class="pill ${m.stock<=3?'red':'green'}">${m.stock<=3?'Pocas unidades':'Registrado'}</span>`}</article>`}
function getAlerts(){let a=[];meds.forEach(m=>{if(m.stock<=3)a.push({type:'red',icon:'⚠️',title:'Medicamento por agotarse',text:`${m.name}: quedan ${m.stock} unidades según el registro.`});if(m.expiry&&left(m.expiry)<=30)a.push({type:'amber',icon:'📅',title:left(m.expiry)<0?'Fecha registrada ya pasó':'Próximo vencimiento',text:`${m.name}: fecha registrada ${fmt(m.expiry)}.`})});return a}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(page==='home')view.innerHTML=head('¡Hola! 👋','Organiza tus medicamentos y consulta tus recordatorios.')+`<div class="welcome"><div><h3>Tu salud, en orden</h3><p>Un espacio sencillo para llevar el registro de tus medicamentos.</p></div><div class="big">💙</div></div><div class="stats"><div class="stat"><b>${meds.length}</b><span>Medicamentos</span></div><div class="stat"><b>${meds.filter(m=>m.taken).length}</b><span>Tomas marcadas</span></div><div class="stat"><b>${getAlerts().length}</b><span>Alertas</span></div></div><div class="sect"><h3>Mis próximas tomas</h3><button class="btn alt sm" data-go="meds">Ver todos</button></div>${meds.length?meds.map(m=>card(m,true)).join(''):'<div class="empty">Aún no tienes medicamentos registrados.</div>'}<div class="notice">💡 MediRecord ayuda a organizar registros. Sigue siempre las indicaciones de los profesionales de salud.</div>`;
else if(page==='meds'){view.innerHTML=head('Mis medicamentos','Registra y consulta la información de tus medicamentos.')+`<form id="medform" class="card"><div class="formgrid"><div class="field full"><label>Nombre del medicamento</label><input id="name" required placeholder="Ej. Acetaminofén"></div><div class="field"><label>Dosis registrada</label><input id="dose" required placeholder="Ej. 1 tableta"></div><div class="field"><label>Horario</label><input id="time" required placeholder="Ej. 8:00 a. m."></div><div class="field"><label>Unidades disponibles</label><input id="stock" type="number" min="0" value="10" required></div><div class="field"><label>Fecha de vencimiento</label><input id="expiry" type="date"></div></div><div class="actions"><button class="btn">＋ Guardar medicamento</button><button class="btn alt" type="reset">Limpiar</button></div></form><div class="sect"><h3>Medicamentos registrados</h3><span class="pill">${meds.length} en total</span></div>${meds.length?meds.map(m=>card(m)).join(''):'<div class="empty">No hay registros todavía.</div>'}`;
$('#medform').addEventListener('submit',e=>{e.preventDefault();meds.push({id:id++,name:$('#name').value.trim(),dose:$('#dose').value.trim(),time:$('#time').value.trim(),stock:Number($('#stock').value),expiry:$('#expiry').value,taken:false});render();show('Medicamento agregado al prototipo.')})}
else if(page==='alerts'){let a=getAlerts();view.innerHTML=head('Centro de alertas','Revisa existencias y fechas de vencimiento registradas.')+(a.length?a.map(x=>`<div class="alert ${x.type}"><span style="font-size:23px">${x.icon}</span><div><strong>${x.title}</strong><p>${esc(x.text)}</p></div></div>`).join(''):'<div class="empty">¡Todo en orden! No hay alertas con los datos actuales.</div>')+'<div class="notice">Las alertas se calculan con los datos de ejemplo o los registros que agregues. No son notificaciones automáticas del teléfono.</div>'}
else if(page==='history')view.innerHTML=head('Mi historial','Consulta las tomas que has marcado en esta demostración.')+`<div class="welcome"><div><h3>${history.length} registros</h3><p>Actividad registrada en esta sesión.</p></div><div class="big">📊</div></div>`+(history.length?history.slice().reverse().map(h=>`<div class="history">🟢 <b>${esc(h.name)}</b><small>${esc(h.date)} · Marcada como tomada</small></div>`).join(''):'<div class="empty">Todavía no hay tomas registradas.</div>')+'<div class="notice">El historial es temporal: al recargar o cerrar la página, los datos de esta demostración pueden reiniciarse.</div>';
else view.innerHTML=head('Mi perfil','Preferencias de la demostración.')+`<div class="med"><div class="medicon">👤</div><div class="mi"><strong>Usuario de demostración</strong><small>Perfil ilustrativo de MediRecord</small></div></div><div class="sect"><h3>Acerca de MediRecord</h3></div><div class="card"><b>Tu salud, siempre en orden.</b><p class="sub" style="margin:8px 0 0">Una propuesta de aplicación para apoyar la organización de medicamentos, recordatorios y seguimiento de tratamientos.</p></div><div class="notice">Prototipo académico. No almacena datos médicos de forma segura, no sustituye orientación médica o farmacéutica y no envía alarmas reales.</div>`}
function show(t){alert(t)}
document.addEventListener('click',e=>{let n=e.target.closest('[data-page]');if(n){page=n.dataset.page;render()}let g=e.target.closest('[data-go]');if(g){page=g.dataset.go;render()}let t=e.target.closest('[data-take]');if(t){let m=meds.find(x=>x.id===+t.dataset.take);if(m&&!m.taken){m.taken=true;history.push({name:m.name,date:'Hoy · '+m.time});render();show('Toma marcada en el historial de esta demostración.')}else show('Esta toma ya estaba marcada.')}});
render();
})();
</script></body></html>
